<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title description">
  <title id="title">TCP 클라이언트와 서버의 연결 및 데이터 송수신 흐름</title>
  <desc id="description">TcpClient가 서버의 TcpListener에 연결하고, 서버가 연결을 수락한 뒤 NetworkStream으로 데이터를 주고받고 Dispose로 연결을 정리하는 흐름입니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e8eef7"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#e8eef7"/>
    </marker>
    <style>
      .background { fill: #15191f; }
      .client { fill: #163557; stroke: #65b8ff; }
      .server { fill: #3f294f; stroke: #da9cff; }
      .step { fill: #202936; stroke: #8799af; }
      .heading { fill: #ffffff; font: 700 22px 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
      .type { fill: #dce8f8; font: 700 20px Consolas, monospace; }
      .body { fill: #e8eef7; font: 18px 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
      .small { fill: #c6d2e1; font: 16px 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
      .line { fill: none; stroke: #e8eef7; stroke-width: 3; marker-end: url(#arrow); }
      .data-line { fill: none; stroke: #9bd6bc; stroke-width: 3; marker-start: url(#arrow-start); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="background" width="1100" height="500" rx="12"/>

  <rect class="client" x="55" y="48" width="275" height="128" rx="12" stroke-width="2"/>
  <text class="heading" x="82" y="90">클라이언트 프로그램</text>
  <text class="type" x="82" y="126">TcpClient</text>
  <text class="small" x="82" y="154">서버에 연결을 요청합니다.</text>

  <rect class="server" x="770" y="48" width="275" height="128" rx="12" stroke-width="2"/>
  <text class="heading" x="797" y="90">서버 프로그램</text>
  <text class="type" x="797" y="126">TcpListener</text>
  <text class="small" x="797" y="154">연결 요청을 기다립니다.</text>

  <rect class="step" x="370" y="208" width="350" height="58" rx="10" stroke-width="2"/>
  <text class="body" x="414" y="245">1. 서버가 창구를 엽니다: Start()</text>

  <path class="line" d="M330 118 H765"/>
  <text class="body" x="405" y="106">2. ConnectAsync(&quot;127.0.0.1&quot;, 7777)</text>

  <rect class="server" x="770" y="208" width="275" height="78" rx="10" stroke-width="2"/>
  <text class="body" x="797" y="240">3. AcceptTcpClientAsync()</text>
  <text class="small" x="797" y="266">연결 수락 → TcpClient 생성</text>

  <rect class="step" x="180" y="330" width="740" height="94" rx="12" stroke-width="2"/>
  <text class="body" x="356" y="366">4. 양쪽에서 NetworkStream을 얻습니다.</text>
  <text class="small" x="366" y="393">바이트는 클라이언트와 서버 사이를 양방향으로 흐릅니다.</text>
  <path class="data-line" d="M245 406 H855"/>

  <text class="small" x="282" y="468">5. 통신이 끝나면 using 선언이 Dispose()를 호출해 연결과 Stream을 정리합니다.</text>
</svg>
