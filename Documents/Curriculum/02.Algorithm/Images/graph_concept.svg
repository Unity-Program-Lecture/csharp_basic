<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <!-- Edges -->
  <line x1="50" y1="100" x2="150" y2="50" stroke="#7f8c8d" stroke-width="2" />
  <line x1="50" y1="100" x2="150" y2="150" stroke="#7f8c8d" stroke-width="2" />
  <line x1="150" y1="50" x2="250" y2="100" stroke="#7f8c8d" stroke-width="2" />
  <line x1="150" y1="150" x2="250" y2="100" stroke="#7f8c8d" stroke-width="2" />
  <line x1="250" y1="100" x2="350" y2="100" stroke="#7f8c8d" stroke-width="2" />

  <!-- Nodes -->
  <circle cx="50" cy="100" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2" />
  <text x="42" y="105" font-family="Arial" font-size="14" fill="white" font-weight="bold">S</text>

  <circle cx="150" cy="50" r="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" />
  <text x="145" y="55" font-family="Arial" font-size="12" fill="white">A</text>

  <circle cx="150" cy="150" r="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" />
  <text x="145" y="155" font-family="Arial" font-size="12" fill="white">B</text>

  <circle cx="250" cy="100" r="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" />
  <text x="245" y="105" font-family="Arial" font-size="12" fill="white">C</text>

  <circle cx="350" cy="100" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2" />
  <text x="342" y="105" font-family="Arial" font-size="14" fill="white" font-weight="bold">E</text>

  <!-- Labels -->
  <text x="80" y="65" font-family="Arial" font-size="12" fill="#7f8c8d" font-weight="bold">Weight: 1</text>
  <text x="80" y="145" font-family="Arial" font-size="12" fill="#7f8c8d" font-weight="bold">Weight: 5</text>
  <text x="180" y="18" font-family="Arial" font-size="14" fill="#3498db" font-weight="bold">Node (Vertex)</text>
  <line x1="180" y1="22" x2="165" y2="40" stroke="#3498db" stroke-width="1" />
  
  <text x="260" y="160" font-family="Arial" font-size="14" fill="#e67e22" font-weight="bold">Edge (Link)</text>
  <line x1="280" y1="145" x2="300" y2="110" stroke="#e67e22" stroke-width="1" />
</svg>