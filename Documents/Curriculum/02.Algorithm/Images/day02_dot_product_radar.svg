<svg width="800" height="460" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="460" fill="#ffffff" />
  <text x="32" y="38" fill="#263238" font-size="22" font-weight="bold">내적: B가 A 방향으로 드리운 그림자</text>
  <text x="32" y="65" fill="#546e7a" font-size="14">A와 B를 정규화하면 A · B는 두 방향이 얼마나 비슷한지 나타내는 점수가 됩니다.</text>

  <circle cx="230" cy="245" r="145" fill="#f8fbfd" stroke="#cfd8dc" stroke-width="2" />
  <line x1="230" y1="100" x2="230" y2="390" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="6 6" />
  <line x1="85" y1="245" x2="375" y2="245" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="6 6" />

  <circle cx="230" cy="245" r="20" fill="#37474f" />
  <text x="211" y="250" fill="#ffffff" font-size="10" font-weight="bold">Monster</text>
  <line x1="230" y1="245" x2="230" y2="115" stroke="#1976d2" stroke-width="7" marker-end="url(#arrow-blue)" />
  <text x="245" y="125" fill="#1976d2" font-size="15" font-weight="bold">A: 정면 방향</text>

  <line x1="230" y1="245" x2="320" y2="155" stroke="#d84315" stroke-width="5" marker-end="url(#arrow-red)" />
  <circle cx="320" cy="155" r="9" fill="#d84315" />
  <text x="332" y="151" fill="#d84315" font-size="15" font-weight="bold">B: 타겟 방향</text>
  <path d="M 255 220 A 35 35 0 0 1 230 210" fill="none" stroke="#6d4c41" stroke-width="3" />
  <text x="260" y="212" fill="#6d4c41" font-size="14" font-weight="bold">θ</text>

  <line x1="320" y1="155" x2="230" y2="155" stroke="#8d6e63" stroke-width="2" stroke-dasharray="5 5" />
  <circle cx="230" cy="155" r="6" fill="#8d6e63" />
  <line x1="230" y1="245" x2="230" y2="155" stroke="#00897b" stroke-width="9" opacity="0.82" />
  <text x="112" y="174" fill="#00897b" font-size="14" font-weight="bold">B의 그림자 길이</text>
  <text x="112" y="194" fill="#00897b" font-size="13">= |B| cos θ</text>

  <circle cx="230" cy="100" r="8" fill="#2e7d32" />
  <text x="168" y="93" fill="#2e7d32" font-size="14" font-weight="bold">Dot 1: 정면</text>
  <circle cx="375" cy="245" r="8" fill="#f9a825" />
  <text x="387" y="250" fill="#f57f17" font-size="14" font-weight="bold">Dot 0: 옆</text>
  <circle cx="230" cy="390" r="8" fill="#c62828" />
  <text x="170" y="416" fill="#c62828" font-size="14" font-weight="bold">Dot -1: 후면</text>

  <rect x="455" y="112" width="295" height="245" rx="8" fill="#f7f9fb" stroke="#d5dde3" />
  <text x="480" y="150" fill="#263238" font-size="18" font-weight="bold">기하학적 해석</text>
  <text x="480" y="185" fill="#37474f" font-size="15">A · B = |A||B| cos θ</text>
  <text x="480" y="222" fill="#37474f" font-size="14">정규화된 벡터라면 |A| = |B| = 1</text>
  <text x="480" y="247" fill="#37474f" font-size="14">그래서 A · B = cos θ</text>
  <text x="480" y="288" fill="#00897b" font-size="14" font-weight="bold">값이 클수록 정면 방향과 많이 겹침</text>
  <text x="480" y="315" fill="#c62828" font-size="14" font-weight="bold">값이 음수면 뒤쪽 방향으로 겹침</text>

  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#1976d2" />
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#d84315" />
    </marker>
  </defs>
</svg>
