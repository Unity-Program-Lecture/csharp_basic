<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 전체 배경 카드 -->
  <rect x="10" y="10" width="780" height="430" rx="15" fill="#1b1e24" stroke="#2d3139" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- 메인 타이틀 -->
  <text x="400" y="45" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" letter-spacing="1">
    직관적 비유로 이해하는 오일러 vs 쿼터니언
  </text>
  <line x1="80" y1="60" x2="720" y2="60" stroke="#373d49" stroke-width="1.5" />

  <!-- ================= LEFT: EULER ANGLES (관절 거치대 비유) ================= -->
  <g transform="translate(40, 75)">
    <!-- 카드 타이틀 -->
    <rect x="30" y="10" width="280" height="35" rx="8" fill="#ff5e62" fill-opacity="0.1" stroke="#ff5e62" stroke-width="1" />
    <text x="170" y="32" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ff8c8f">
      오일러 각도: 3단 관절 거치대 📱
    </text>

    <!-- 스마트폰 거치대 형태의 관절 꼬임 일러스트 (심플) -->
    <!-- 밑받침 -->
    <path d="M 100,280 L 240,280 L 220,295 L 120,295 Z" fill="#4a5263" />
    <!-- 1번 관절 (Y축 회전) -->
    <rect x="160" y="230" width="20" height="50" rx="4" fill="#6c778e" />
    <!-- 2번 관절 (X축 90도 회전하여 누워버림) -->
    <rect x="160" y="180" width="50" height="20" rx="4" fill="#ff9966" transform="rotate(45, 170, 190)" />
    <!-- 3번 관절 (Z축 회전) - 2번과 겹쳐서 자유도가 엉킴 -->
    <rect x="145" y="130" width="50" height="20" rx="4" fill="#ffcc00" transform="rotate(45, 170, 190)" />
    
    <!-- 경고 X 마크 (관절 꼬임 표시) -->
    <circle cx="170" cy="190" r="28" fill="#ff3333" fill-opacity="0.2" stroke="#ff3333" stroke-width="2.5" stroke-dasharray="4,2" />
    <path d="M 158,178 L 182,202 M 182,178 L 158,202" stroke="#ff3333" stroke-width="4.5" stroke-linecap="round" />

    <!-- 텍스트 설명 -->
    <text x="170" y="90" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#ffb0b2" font-weight="bold">"관절이 한 방향으로 완전히 꺾이면"</text>
    <text x="170" y="110" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8e9bb0">다른 관절 축과 겹쳐서 락(Lock)이 걸립니다.</text>

    <!-- 요약 설명 카드 -->
    <rect x="20" y="310" width="300" height="45" rx="6" fill="#291c1e" stroke="#ff5e62" stroke-width="1.5" />
    <text x="170" y="328" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ff8c8f" font-weight="bold">
      단계적으로 꺾이는 3단 거치대
    </text>
    <text x="170" y="345" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cdd3de">
      특정 위치에서 축이 포개져 좌우 회전 불가! (짐벌락)
    </text>
  </g>

  <!-- 중앙 구분선 -->
  <line x1="400" y1="90" x2="400" y2="400" stroke="#373d49" stroke-width="1.5" stroke-dasharray="5,5" />

  <!-- ================= RIGHT: QUATERNION (트랙볼/농구공 비유) ================= -->
  <g transform="translate(420, 75)">
    <!-- 카드 타이틀 -->
    <rect x="30" y="10" width="280" height="35" rx="8" fill="#00c6ff" fill-opacity="0.1" stroke="#00c6ff" stroke-width="1" />
    <text x="170" y="32" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#00e5ff">
      쿼터니언: 360도 자유로운 트랙볼 🔮
    </text>

    <!-- 트랙볼/농구공과 손끝으로 굴리는 심플 일러스트 -->
    <!-- 볼 스탠드(지지대) -->
    <path d="M 120,260 Q 170,290 220,260" fill="none" stroke="#445069" stroke-width="8" stroke-linecap="round" />
    
    <!-- 구체 (트랙볼) -->
    <circle cx="170" cy="180" r="70" fill="#1b2e46" stroke="#00c6ff" stroke-width="3" />
    <!-- 광택 효과 -->
    <circle cx="150" cy="155" r="55" fill="none" stroke="#255180" stroke-width="1.5" stroke-dasharray="30, 20" />
    
    <!-- 손가락 터치 위치 & 회전 스와이프 화살표 -->
    <circle cx="150" cy="140" r="10" fill="#00e5ff" fill-opacity="0.3" stroke="#00e5ff" stroke-width="1.5" />
    <circle cx="150" cy="140" r="4" fill="#ffffff" />
    
    <!-- 스와이프 자유 회전 궤적 화살표 -->
    <path d="M 130,130 Q 180,110 220,150" fill="none" stroke="#00e5ff" stroke-width="3" marker-end="url(#arrowBlue)" stroke-linecap="round" />
    
    <defs>
      <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#00e5ff" />
      </marker>
    </defs>

    <!-- 텍스트 설명 -->
    <text x="170" y="90" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8eaff" font-weight="bold">"원하는 방향으로 쓱 굴리면 끝"</text>
    <text x="170" y="110" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8e9bb0">축 꼬임 없이 한 번의 터치로 부드럽게 회전합니다.</text>

    <!-- 요약 설명 카드 -->
    <rect x="20" y="310" width="300" height="45" rx="6" fill="#11253a" stroke="#00c6ff" stroke-width="1.5" />
    <text x="170" y="328" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#00e5ff" font-weight="bold">
      어떤 관절도 없는 통짜 구체
    </text>
    <text x="170" y="345" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cdd3de">
      회전축(u)과 각도(θ)만으로 단번에 회전! (짐벌락 해방)
    </text>
  </g>
</svg>
